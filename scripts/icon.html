<!doctype html>
<!-- Rend public/favicon.svg en PNG (apple-touch-icon, favicon.ico). Taille en px dans le hash : icon.html#180 -->
<html>
  <head>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      img {
        display: block;
      }
    </style>
  </head>
  <body>
    <img src="../public/favicon.svg" alt="" />
    <script>
      const size = Number(location.hash.slice(1)) || 64;
      const img = document.querySelector('img');
      img.width = size;
      img.height = size;
    </script>
  </body>
</html>
